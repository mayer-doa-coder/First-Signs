services:
  - type: web
    name: first-signs
    runtime: node
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Render asks for each value when this Blueprint is first created. Do
      # not replace these entries with real credentials in version control.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Set these to the final https://<service>.onrender.com or custom-domain
      # origin. NEXT_PUBLIC_APP_URL is embedded into the browser bundle.
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: TB_CENTRE_STAFF_PIN
        sync: false
